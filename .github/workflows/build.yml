name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run project tests
        run: ./gradlew --no-daemon --console=plain --continue build runGameTestServer

      - name: Collect GameTest summary on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f build/gametest/logs/latest.log ]]; then
            grep -F 'GameTestServer' build/gametest/logs/latest.log > build/gametest/server-summary.log || true
          fi

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-test-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/test-results/test/TEST-*.xml
            build/gametest/results.xml
            build/gametest/server-summary.log

  m1-05-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install M1-05 test dependency
        run: python -m pip install nbtlib==2.0.4

      - name: Run M1-05 offline acceptance gate tests
        run: python -B -m unittest discover -v -s test-data/m1-05
