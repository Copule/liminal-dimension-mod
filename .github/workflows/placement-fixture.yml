name: Placement Fixture

on:
  push:
    paths:
      - 'test-data/m1-10-pre-placement-guard/**'
      - 'src/testFixtures/java/io/github/copule/liminaldimension/playerdata/PlayerDimensionProbe.java'
      - '.github/workflows/placement-fixture.yml'
  pull_request:
    paths:
      - 'test-data/m1-10-pre-placement-guard/**'
      - 'src/testFixtures/java/io/github/copule/liminaldimension/playerdata/PlayerDimensionProbe.java'
      - '.github/workflows/placement-fixture.yml'

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and check standalone fixture
        run: ./gradlew --no-daemon --console=plain -p test-data/m1-10-pre-placement-guard guardProbe jar

      - name: Build isolated authenticated placement experiment
        run: ./gradlew --no-daemon --console=plain -p test-data/m1-10-pre-placement-guard/integration build
